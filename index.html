    <!-- Audio Synth using Web Audio API (No External Audio Files) -->
    <script>
        // Web Audio API Synthesizer Context
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }
        }

        // Play Tone Generator
        function playTone(freq, type = 'sine', duration = 0.25, volume = 0.1) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.warn('Audio play block:', e);
            }
        }

        // Sound FX Preset
        const SoundFX = {
            click: (index) => playTone(200 + index * 40, 'triangle', 0.15, 0.15),
            sequence: (index) => playTone(300 + index * 60, 'sine', 0.25, 0.2),
            success: () => {
                playTone(523.25, 'sine', 0.15, 0.2); // C5
                setTimeout(() => playTone(659.25, 'sine', 0.15, 0.2), 100); // E5
                setTimeout(() => playTone(783.99, 'sine', 0.3, 0.2), 200); // G5
            },
            fail: () => {
                playTone(180, 'sawtooth', 0.3, 0.25);
                setTimeout(() => playTone(130, 'sawtooth', 0.4, 0.25), 150);
            }
        };

        // Game State Variables
        const GRID_SIZE = 16;
        let sequence = [];
        let playerSequence = [];
        let level = 1;
        let score = 0;
        let highScore = localStorage.getItem('cyber_grid_highscore') || 0;
        let isPlaying = false;
        let isUserTurn = false;

        // UI Elements
        const gridContainer = document.getElementById('grid-container');
        const scoreDisplay = document.getElementById('score-display');
        const highscoreDisplay = document.getElementById('highscore-display');
        const levelDisplay = document.getElementById('level-display');
        const systemStatus = document.getElementById('system-status');
        const messageBox = document.getElementById('message-box');
        const startBtn = document.getElementById('start-btn');
        const btnText = document.getElementById('btn-text');

        // Initialize UI Grid
        function buildGrid() {
            gridContainer.innerHTML = '';
            for (let i = 0; i < GRID_SIZE; i++) {
                const cell = document.createElement('button');
                cell.className = `
                    relative w-full h-full rounded-xl bg-[#161b22] border border-[#21262d]
                    hover:border-[#58a6ff] focus:outline-none transition-all duration-200
                    cursor-pointer overflow-hidden flex items-center justify-center group
                `;
                cell.dataset.index = i;
                
                // Subtle Inner Glow Element
                const innerGlow = document.createElement('div');
                innerGlow.className = 'absolute inset-0 bg-[#79c0ff]/0 group-hover:bg-[#79c0ff]/5 transition-colors duration-200';
                cell.appendChild(innerGlow);

                // Click Event
                cell.addEventListener('click', () => handleCellClick(i));
                gridContainer.appendChild(cell);
            }
            highscoreDisplay.textContent = String(highScore).padStart(4, '0');
        }

        // Start / Reset Game
        function startGame() {
            initAudio();
            if (isPlaying && isUserTurn) return;

            isPlaying = true;
            level = 1;
            score = 0;
            sequence = [];
            playerSequence = [];

            scoreDisplay.textContent = '0000';
            levelDisplay.textContent = '01';
            systemStatus.textContent = 'RUNNING';
            systemStatus.className = 'text-[#3fb950] font-semibold animate-pulse';

            btnText.textContent = 'TRANSMITTING...';
            startBtn.disabled = true;
            startBtn.classList.add('opacity-50', 'cursor-not-allowed');

            updateMessage('Khởi tạo hệ thống... Quan sát chuỗi dữ liệu.', 'text-[#79c0ff]');
            
            setTimeout(nextRound, 1000);
        }

        // Next Round Sequence
        function nextRound() {
            playerSequence = [];
            isUserTurn = false;
            levelDisplay.textContent = String(level).padStart(2, '0');
            updateMessage(`LEVEL ${level}: Đang tải chuỗi dữ liệu...`, 'text-[#bc8cff]');

            // Add new random tile to sequence
            const nextCell = Math.floor(Math.random() * GRID_SIZE);
            sequence.push(nextCell);

            // Play Sequence
            playSequence();
        }

        // Play Visual Sequence for User
        function playSequence() {
            let i = 0;
            const interval = setInterval(() => {
                if (i >= sequence.length) {
                    clearInterval(interval);
                    isUserTurn = true;
                    updateMessage('LƯỢT CỦA BẠN: Tái lập trình đúng thứ tự!', 'text-[#3fb950]');
                    btnText.textContent = 'AWAITING INPUT';
                    return;
                }
                flashCell(sequence[i], 'ice');
                SoundFX.sequence(sequence[i]);
                i++;
            }, Math.max(300, 600 - level * 25)); // Dynamic speedup as level advances
        }

        // Flash Tile Visual Effect
        function flashCell(index, mode = 'ice') {
            const cell = gridContainer.children[index];
            if (!cell) return;

            if (mode === 'ice') {
                cell.classList.add('bg-[#79c0ff]', 'shadow-[0_0_20px_#79c0ff]', 'border-white');
            } else if (mode === 'purple') {
                cell.classList.add('bg-[#bc8cff]', 'shadow-[0_0_20px_#bc8cff]', 'border-white');
            } else if (mode === 'error') {
                cell.classList.add('bg-[#f85149]', 'shadow-[0_0_20px_#f85149]', 'border-white');
            }

            setTimeout(() => {
                cell.classList.remove(
                    'bg-[#79c0ff]', 'bg-[#bc8cff]', 'bg-[#f85149]',
                    'shadow-[0_0_20px_#79c0ff]', 'shadow-[0_0_20px_#bc8cff]', 'shadow-[0_0_20px_#f85149]',
                    'border-white'
                );
            }, 250);
        }

        // Handle User Input Click
        function handleCellClick(index) {
            if (!isPlaying || !isUserTurn) return;

            SoundFX.click(index);
            flashCell(index, 'purple');
            playerSequence.push(index);

            const currentIndex = playerSequence.length - 1;

            // Verify Tile
            if (playerSequence[currentIndex] !== sequence[currentIndex]) {
                gameOver();
                return;
            }

            // Completed Round
            if (playerSequence.length === sequence.length) {
                isUserTurn = false;
                score += level * 100;
                scoreDisplay.textContent = String(score).padStart(4, '0');

                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('cyber_grid_highscore', highScore);
                    highscoreDisplay.textContent = String(highScore).padStart(4, '0');
                }

                SoundFX.success();
                updateMessage('XÁC NHẬN CHÍNH XÁC // Đang chuyển Level tiếp theo...', 'text-[#3fb950]');
                level++;
                setTimeout(nextRound, 1200);
            }
        }

        // Game Over Logic
        function gameOver() {
            SoundFX.fail();
            isPlaying = false;
            isUserTurn = false;

            // Flash all grid error
            for (let i = 0; i < GRID_SIZE; i++) {
                flashCell(i, 'error');
            }

            systemStatus.textContent = 'SYSTEM BREACH';
            systemStatus.className = 'text-[#f85149] font-bold animate-bounce';

            updateMessage('TRUY CẬP THẤT BẠI: Lỗi mã hóa dữ liệu.', 'text-[#f85149]');

            btnText.textContent = 'RETRY PROTOCOL';
            startBtn.disabled = false;
            startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }

        // Helper Message Updater
        function updateMessage(msg, colorClass = 'text-[#8b949e]') {
            messageBox.textContent = msg;
            messageBox.className = `h-6 text-xs text-center font-mono tracking-wide transition-all ${colorClass}`;
        }

        // Reset High Score
        function resetHighScore() {
            localStorage.removeItem('cyber_grid_highscore');
            highScore = 0;
            highscoreDisplay.textContent = '0000';
            updateMessage('Highscore đã được dọn dẹp.', 'text-[#8b949e]');
        }

        // On Page Load
        window.onload = () => {
            buildGrid();
            lucide.createIcons();
        };
    </script>
</body>
</html>
